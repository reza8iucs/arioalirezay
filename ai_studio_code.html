<!-- Save as ario-pokedex-pro.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Ario's Legendary Pokédex</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #222; color: white; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #333; border: 3px solid #ffde00; border-radius: 15px; padding: 15px; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-10px); background: #444; border-color: #ff0000; }
        img { width: 100%; filter: drop-shadow(2px 4px 6px black); }
        .btn { background: #ffde00; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        h1 { font-size: 3rem; color: #ffde00; text-shadow: 3px 3px #3b4cca; }
    </style>
</head>
<body>
    <h1>ARIO'S LEGENDS</h1>
    <div class="grid" id="list"></div>

    <script>
        const ids = [144, 145, 146, 150, 151, 243, 244, 245, 249, 250, 382, 383, 384, 483, 484]; // Shortened list for speed
        const list = document.getElementById('list');

        ids.forEach(id => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png">
                <button class="btn">CATCH IT!</button>
            `;
            
            // Play Cry when clicked
            card.onclick = () => {
                new Audio(`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${id}.ogg`).play();
            };

            // Confetti when button clicked
            card.querySelector('button').onclick = (e) => {
                e.stopPropagation();
                confetti({ particleCount: 150, spread: 60 });
            };

            list.appendChild(card);
        });
    </script>
</body>
</html>
